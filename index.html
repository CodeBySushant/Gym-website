<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supermen Fitness Gym — Fitness Center in Nehru Nagar, Bhopal</title>
    <meta name="description" content="Supermen Fitness Gym in Nehru Nagar, Bhopal. Elite equipment, certified trainers, and transparent membership plans. Open 6 AM to 10 PM, Monday to Saturday. Book your free trial today." />
    <meta name="theme-color" content="#FF003C" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preload the hero background: it is the LCP element, and the browser
         would otherwise not discover it until React has mounted. Each is
         media-gated so phones never fetch the desktop crop. -->
    <link rel="preload" as="image" href="/assets/background1.webp" media="(min-width: 768px)" />
    <link rel="preload" as="image" href="/assets/phonebackground1.webp" media="(max-width: 767px)" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Supermen Fitness Gym — Fitness Center in Nehru Nagar, Bhopal" />
    <meta property="og:description" content="Elite equipment, certified trainers, and transparent membership plans. Open 6 AM to 10 PM, Monday to Saturday. Book your free trial today." />
    <meta property="og:site_name" content="Supermen Fitness Gym" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Local business structured data — helps Google show hours, phone and address -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ExerciseGym",
        "name": "Supermen Fitness Gym",
        "description": "Fitness center in Nehru Nagar, Bhopal offering elite equipment, certified trainers and transparent membership plans.",
        "telephone": "+918305213300",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "2nd Floor, BM-125, Main Road, Near Sai Mandir, Nehru Nagar",
          "addressLocality": "Bhopal",
          "addressRegion": "Madhya Pradesh",
          "postalCode": "462003",
          "addressCountry": "IN"
        },
        "sameAs": ["https://www.instagram.com/supermen_fitness"],
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
            "opens": "06:00",
            "closes": "22:00"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
